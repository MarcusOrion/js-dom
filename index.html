<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="biglietto, prezzo biglietto, treno">
    <meta author="Marco Manvati ( MarcusOrion)">
    <!-- Google Font-->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
     <!-- Bootstrap -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <!-- CSS -->
      <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap Icon -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
     <!-- JavaScript -->
     <script src="js/app.js" defer></script>

    <title>Calcolo prezzo del biglietto (js-dom)</title>
</head>
 <body>
    <header class="d-flex align-items-center bg-white mb-3">
            <i class="bi bi-train-front text-primary fs-1 ms-3"></i>
            <h1 class="ms-3 mt-2 font-inter fw-bold">EuroRail Express</h1>
        <div class="d-flex justify-content-center align-items-center flex-grow-1 mt-3">
            <a href="#" class="text-decoration-none text-dark fs-3 mx-3">Home</a>
            <a href="#" class="text-decoration-none text-dark fs-3 mx-3">Orari</a>
            <a href="#" class="text-decoration-none text-dark fs-3 mx-3">Biglietti</a>
        </div>
    </header>
    <hr>
    <main class="container my-5 bg-white rounded-4">
    <form id="user-form">
        <!-- Nome -->
        <div class="mb-3">
            <label for="name" class="form-label">Nome Cognome</label>
            <input type="text" class="form-control" id="name" required>
        </div>
        <!-- Km da percorrere -->
        <div class="mb-3">
            <label for="distance" class="form-label">Km da percorrere</label>
            <input type="number" class="form-control" id="distance" required>
        </div>
        <!-- Età -->
        <select id="age" class="form-select" required>
            <option value="maggiorenne">Maggiorenne</option>
            <option value="minorenne">Minorenne</option>
            <option value="over">Over 65</option>
	    </select>
        <!-- Bottoni -->
        <div class="text-center">
        <button type="submit" class="btn btn-primary mt-3">Genera</button>
        <button type="reset" class="btn btn-secondary mt-3 ms-3">Annulla</button>
        </div>
    </form>
    </main>
    <h2 class="h1">Il tuo biglietto</h2>
    <div class="text-left">
    <h3 class="h2">Dettaglio passeggeri</h3>
    </div>
    <div class="col">
        <div>
            <h3 class="h2">NOME PASSEGGERO</h3>
            <span id="display-name"></span>
        </div>
        <div>
        <h4>Offerta</h4>
        <span id="display-offer"></span>
        </div>
        <div>
        <h4>Carrozza</h4>
        <span id="display-wagon"></span>
        </div>
        <div>
        <h4>Codice CP</h4>
        <span id="display-cp"></span>
        </div>
        <div>
        <h4>Costo bilgietto</h4>
        <span id="display-cost"></span>
        </div>
    </div>
</body>
</html>
