<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="biglietto, prezzo biglietto, treno">
    <meta author="Marco Manvati ( MarcusOrion)">
    <!-- CSS -->
     <style src="css/style.css"></style>
    <!-- Bootstrap -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- JavaScript -->
    <script src="js/app.js" defer></script>

    <title>Calcolo prezzo del biglietto (js-dom)</title>
</head>
<body>
    <header class="container mt-5 text-center">
        <h1>Calcola il prezzo del tuo biglietto</h1>
    </header>
    <main class="container my-5">
    <form id="user-form">
        <!-- Nome -->
        <div class="mb-3">
            <label for="name" class="form-label">Nome Cognome</label>
            <input type="text" class="form-control" id="name" required>
        </div>
        <!-- Km da percorrere -->
        <div class="mb-3">
            <label for="distance" class="form-label">Km da percorrere</label>
            <input type="text" class="form-control" id="distance" required>
        </div>
        <!-- Età -->
        <select id="age" class="form-select" required>
            <option value="maggiorenne">Maggiorenne</option>
            <option value="minorenne">Minorenne</option>
            <option value="overo60">Over 60</option>
	    </select>
        <div class="text-center">
        <button type="submit" class="btn btn-primary mt-3">Genera</button>
        <button type="submit" class="btn btn-secondary mt-3 ms-3">Annulla</button>
        </div>
    </form>
    </form>
</body>
</html>
